<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WHO Anthro-Aligned Multi-Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background-color: #f4f7f9; }
        .card { border: 1px solid #e0e0e0; padding: 30px; border-radius: 12px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #0056b3; margin-top: 0; text-align: center; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .row div { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85em; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 14px; width: 100%; margin-top: 20px; cursor: pointer; border-radius: 6px; font-size: 1.1em; font-weight: bold; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; background: white; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: center; }
        th { background-color: #007bff; color: white; font-size: 0.9em; }
        .result-val { font-weight: bold; color: #0056b3; }
        #summary { margin-top: 15px; font-size: 0.9em; color: #666; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>Growth Analysis Dashboard</h2>
    
    <div class="row">
        <div>
            <label>Sex</label>
            <select id="sex">
                <option value="boys">Boy</option>
                <option value="girls">Girl</option>
            </select>
        </div>
        <div>
            <label>Oedema</label>
            <select id="oedema">
                <option value="n">No</option>
                <option value="y">Yes</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div>
            <label>Date of Birth</label>
            <input type="date" id="dob">
        </div>
        <div>
            <label>Date of Measurement</label>
            <input type="date" id="dom">
        </div>
    </div>

    <div class="row">
        <div>
            <label>Measurement Type</label>
            <select id="measure">
                <option value="H" selected>H (Standing Height)</option>
                <option value="L">L (Recumbent Length)</option>
            </select>
        </div>
        <div>
            <label>Weight (kg)</label>
            <input type="number" id="weight" step="0.01">
        </div>
        <div>
            <label>Height/Length (cm)</label>
            <input type="number" id="height" step="0.1">
        </div>
    </div>

    <button onclick="calculateAll()">Run Comprehensive Analysis</button>

    <div id="summary"></div>

    <table>
        <thead>
            <tr>
                <th>Indicator</th>
                <th>Standard Value</th>
                <th>Z-Score</th>
            </tr>
        </thead>
        <tbody id="resultsTable">
            <tr><td colspan="3">Enter data to see results</td></tr>
        </tbody>
    </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script>
    document.getElementById('dom').valueAsDate = new Date();

    async function calculateAll() {
        const sex = document.getElementById('sex').value;
        const dob = new Date(document.getElementById('dob').value);
        const dom = new Date(document.getElementById('dom').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const measure = document.getElementById('measure').value;
        const oedema = document.getElementById('oedema').value;

        if (isNaN(dob) || isNaN(dom)) { alert("Check dates"); return; }
        const ageDays = Math.floor((dom - dob) / (1000 * 60 * 60 * 24));
        
        // clenhei Logic
        let clenhei = height;
        if (!isNaN(height)) {
            if (ageDays < 731 && measure === 'H') clenhei += 0.7;
            else if (ageDays >= 731 && measure === 'L') clenhei -= 0.7;
        }

        // Standard BMI calculation
        const bmiVal = (!isNaN(weight) && !isNaN(clenhei)) ? (weight / Math.pow(clenhei / 100, 2)) : null;

        const indicators = [
            { id: 'hfa', label: 'Height-for-age', val: clenhei, unit: 'cm' },
            { id: 'wfa', label: 'Weight-for-age', val: weight, unit: 'kg' },
            { id: 'bmi', label: 'BMI-for-age', val: bmiVal, unit: 'kg/m²' },
            { id: 'wfh', label: 'Weight-for-height', val: weight, unit: 'kg' }
        ];

        document.getElementById('resultsTable').innerHTML = "";
        document.getElementById('summary').innerHTML = `Age: ${ageDays} days | Adjusted Height: ${isNaN(clenhei) ? 'NA' : clenhei.toFixed(1)} cm`;

        for (let ind of indicators) {
            const isWeightRelated = (ind.id !== 'hfa');
            if (oedema === 'y' && isWeightRelated) {
                renderRow(ind.label, ind.val, "NA (Oedema)", ind.unit);
                continue;
            }

            if (isNaN(ind.val) || ind.val === null) {
                renderRow(ind.label, "NA", "NA", ind.unit);
                continue;
            }

            const fileName = `data/${ind.id}_${sex}_0_5.csv`;
            Papa.parse(fileName, {
                download: true, header: true, dynamicTyping: true,
                complete: function(results) {
                    const data = results.data.filter(row => row.L !== undefined);
                    const lookupCol = (ind.id === 'wfh') ? 'Centimeters' : 'Day';
                    const target = (ind.id === 'wfh') ? clenhei : ageDays;

                    const match = data.reduce((prev, curr) => 
                        (Math.abs(curr[lookupCol] - target) < Math.abs(prev[lookupCol] - target) ? curr : prev)
                    );

                    const z = (Math.pow((ind.val / match.M), match.L) - 1) / (match.L * match.S);
                    renderRow(ind.label, ind.val, z.toFixed(2), ind.unit);
                },
                error: () => renderRow(ind.label, ind.val, "File Error", ind.unit)
            });
        }
    }

    function renderRow(label, rawVal, zVal, unit) {
        const table = document.getElementById('resultsTable');
        const displayVal = (typeof rawVal === 'number') ? rawVal.toFixed(2) : rawVal;
        table.innerHTML += `<tr>
            <td>${label}</td>
            <td>${displayVal} ${unit}</td>
            <td class="result-val">${zVal}</td>
        </tr>`;
    }
</script>
</body>
</html>
