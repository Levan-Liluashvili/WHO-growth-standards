<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WHO Anthro-Aligned Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background-color: #f4f7f9; }
        .card { border: 1px solid #e0e0e0; padding: 30px; border-radius: 12px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #0056b3; margin-top: 0; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .row div { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85em; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 14px; width: 100%; margin-top: 20px; cursor: pointer; border-radius: 6px; font-size: 1em; font-weight: bold; }
        button:hover { background: #0056b3; }
        #result { margin-top: 25px; padding: 20px; border-radius: 8px; background: #e9ecef; font-size: 1.1em; line-height: 1.6; border-left: 6px solid #007bff; }
        .missing { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2> WHO Growth Standards Calculator</h2>
    <p><small>Implementing WHO Anthro R Logic</small></p>

    <div class="row">
        <div>
            <label>Sex</label>
            <select id="sex">
                <option value="boys">Boy</option>
                <option value="girls">Girl</option>
            </select>
        </div>
        <div>
            <label>Oedema</label>
            <select id="oedema">
                <option value="n">No</option>
                <option value="y">Yes</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div>
            <label>Date of Birth</label>
            <input type="date" id="dob">
        </div>
        <div>
            <label>Date of Measurement</label>
            <input type="date" id="dom">
        </div>
    </div>

    <div class="row">
        <div>
            <label>Measurement Type</label>
            <select id="measure">
                <option value="H" selected>H (Standing Height)</option>
                <option value="L">L (Recumbent Length)</option>
            </select>
        </div>
        <div>
            <label>Weight (kg)</label>
            <input type="number" id="weight" step="0.01" placeholder="e.g. 10.5">
        </div>
    </div>

    <div class="row">
        <div>
            <label>Height/Length (cm)</label>
            <input type="number" id="height" step="0.1" placeholder="e.g. 85.5">
        </div>
        <div style="visibility: hidden;">
            <!-- This empty div maintains the grid alignment for the height field -->
            <label>Spacer</label>
            <input type="text">
        </div>
    </div>

    <!-- BMI appears on its own line centered -->
    <div id="bmiDisplay" style="margin-top: 15px; text-align: left; font-weight: bold; color: #0056b3; min-height: 1.2em;"></div>

    <!-- Button takes full width -->
    <button onclick="calculate()">Calculate Z-Score</button>

<div id="result" style="margin-top: 25px; padding: 20px; border-radius: 8px; background: #f8f9fa; border-left: 6px solid #007bff;">
    <table style="width: 100%; border-collapse: collapse;">
<thead>
    <tr style="border-bottom: 2px solid #dee2e6; text-align: left;">
        <th style="padding: 8px;">Indicator</th>
        <th style="padding: 8px;">Z-Score</th>
        <th style="padding: 8px;">Percentile</th>
    </tr>
</thead>
        <tbody id="multi-results">
            <tr><td colspan="2" style="padding: 10px; color: #666;">Waiting for input...</td></tr>
        </tbody>
    </table>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script>
    document.getElementById('dom').valueAsDate = new Date();

    async function calculate() {
        const sex = document.getElementById('sex').value;
        const dob = new Date(document.getElementById('dob').value);
        const dom = new Date(document.getElementById('dom').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const measure = document.getElementById('measure').value;
        const oedema = document.getElementById('oedema').value;

        if (isNaN(dob) || isNaN(dom)) { alert("Please enter valid dates."); return; }

        // 1. Calculate Age in Days
        const ageDays = Math.floor((dom - dob) / (1000 * 60 * 60 * 24));
        if (ageDays < 0) { alert("Measurement date must be after birth date."); return; }

        // 2. clenhei Logic (Anthro R Package Standard)
        let clenhei = height;
        let correctionNote = "";
        
        if (ageDays < 731 && measure === 'H') {
            clenhei += 0.7; 
            correctionNote = "(+0.7cm correction applied)";
        } else if (ageDays >= 731 && measure === 'L') {
            clenhei -= 0.7; 
            correctionNote = "(-0.7cm correction applied)";
        }

        // 3. Prepare Multi-Indicator Configuration
        const indicatorConfig = [
            { id: 'hfa', name: 'Height-for-age', val: clenhei },
            { id: 'wfa', name: 'Weight-for-age', val: weight },
            { id: 'bmi', name: 'BMI-for-age', val: (!isNaN(weight) && !isNaN(clenhei)) ? (weight / Math.pow(clenhei / 100, 2)) : NaN },
            { id: 'wfh', name: 'Weight-for-height', val: weight }
        ];

        // Clear the results table
        const resultsBody = document.getElementById('multi-results');
        resultsBody.innerHTML = ""; 

// 4. Create an array of Promises to fetch all data first
        const promises = indicatorConfig.map(ind => {
            const isWeightRelated = (ind.id !== 'hfa');

            // Return NA immediately if data is missing or Oedema is present
            if (isNaN(ind.val) || (oedema === 'y' && isWeightRelated)) {
                return Promise.resolve({ name: ind.name, score: "NA", percentile: "NA" });
            }

            return new Promise((resolve) => {
                const fileName = `data/${ind.id}_${sex}_0_5.csv`;
                Papa.parse(fileName, {
                    download: true,
                    header: true,
                    dynamicTyping: true,
                    complete: function(results) {
                        const data = results.data.filter(row => row.L !== undefined);
                        const lookupCol = (ind.id === 'wfh') ? 'Centimeters' : 'Day';
                        const target = (ind.id === 'wfh') ? clenhei : ageDays;

                        const match = data.reduce((prev, curr) => 
                            (Math.abs(curr[lookupCol] - target) < Math.abs(prev[lookupCol] - target) ? curr : prev)
                        );

                        const zScore = (Math.pow((ind.val / match.M), match.L) - 1) / (match.L * match.S);
                        const percentile = zToPercentile(zScore);
                        
                        resolve({ name: ind.name, score: zScore.toFixed(2), percentile: percentile });
                    }
                });
            });
        });

        // 5. Wait for all files and then display in order
        Promise.all(promises).then(results => {
            resultsBody.innerHTML = ""; // Clear one last time
            results.forEach(res => {
                appendResultRow(res.name, res.score, res.percentile);
            });
        });
        }
    }

    // Helper function to update the table with 3 columns
    function appendResultRow(name, score, percentile) {
        const resultsBody = document.getElementById('multi-results');
        resultsBody.innerHTML += `
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 8px;">${name}</td>
                <td style="padding: 8px; font-weight: bold; color: ${score === 'NA' ? '#dc3545' : '#0056b3'};">${score}</td>
                <td style="padding: 8px; color: #666;">${percentile}</td>
            </tr>`;
    }

    // Real-time BMI display
    function updateBMI() {
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const display = document.getElementById('bmiDisplay');
        if (!isNaN(weight) && !isNaN(height) && height > 0) {
            const bmi = weight / Math.pow(height / 100, 2);
            display.innerText = `BMI ${bmi.toFixed(2)}`;
        } else {
            display.innerText = "";
        }
    }

    document.getElementById('weight').addEventListener('input', updateBMI);
    document.getElementById('height').addEventListener('input', updateBMI);

    // Math function for Percentiles
    function zToPercentile(z) {
        if (z === "NA" || isNaN(z)) return "NA";
        const t = 1 / (1 + 0.2316419 * Math.abs(z));
        const d = 0.3989423 * Math.exp(-z * z / 2);
        let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
        if (z > 0) p = 1 - p;
        return (p * 100).toFixed(1) + "th";
    }
    
</script>
</body>
</html>
