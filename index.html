<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WHO Anthro-Aligned Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background-color: #f4f7f9; }
        .card { border: 1px solid #e0e0e0; padding: 30px; border-radius: 12px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #0056b3; margin-top: 0; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; }
        .row div { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85em; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 14px; width: 100%; margin-top: 20px; cursor: pointer; border-radius: 6px; font-size: 1em; font-weight: bold; }
        button:hover { background: #0056b3; }
        #result { margin-top: 25px; padding: 20px; border-radius: 8px; background: #f8f9fa; border-left: 6px solid #007bff; }
        .info-bar { margin-top: 15px; display: flex; justify-content: space-between; font-weight: bold; color: #0056b3; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="card">
    <h2>Growth Standards Calculator</h2>
    
    <div class="row">
        <div>
            <label>Sex</label>
            <select id="sex">
                <option value="boys">Boy</option>
                <option value="girls">Girl</option>
            </select>
        </div>
        <div>
            <label>Oedema</label>
            <select id="oedema">
                <option value="n">No</option>
                <option value="y">Yes</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div>
            <label>Date of Birth</label>
            <input type="date" id="dob">
        </div>
        <div>
            <label>Date of Measurement</label>
            <input type="date" id="dom">
        </div>
    </div>

    <div class="row">
        <div>
            <label>Measurement Type</label>
            <select id="measure">
                <option value="H" selected>H (Standing Height)</option>
                <option value="L">L (Recumbent Length)</option>
            </select>
        </div>
        <div>
            <label>Weight (kg)</label>
            <input type="number" id="weight" step="0.01" placeholder="e.g. 10.5">
        </div>
    </div>

    <div class="row">
        <div>
            <label>Height/Length (cm)</label>
            <input type="number" id="height" step="0.1" placeholder="e.g. 85.5">
        </div>
        <div style="visibility: hidden;">
            <label>Spacer</label><input type="text">
        </div>
    </div>

    <div class="info-bar">
        <span id="bmiDisplay"></span>
        <span id="ageDisplay" style="color: #555; font-size: 0.9em;"></span>
    </div>

    <button onclick="calculate()">Calculate Z-Score</button>

    <div id="result">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 2px solid #dee2e6; text-align: left;">
                    <th style="padding: 8px;">Indicator</th>
                    <th style="padding: 8px;">Z-Score</th>
                    <th style="padding: 8px;">Percentile</th>
                </tr>
            </thead>
            <tbody id="multi-results">
                <tr><td colspan="3" style="padding: 10px; color: #666;">Waiting for input...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script>
    // 1. Set default measurement date to today on page load
    document.getElementById('dom').valueAsDate = new Date();

    async function calculate() {
        const sex = document.getElementById('sex').value;
        const dob = new Date(document.getElementById('dob').value);
        const dom = new Date(document.getElementById('dom').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const measure = document.getElementById('measure').value;
        const oedema = document.getElementById('oedema').value;

        if (isNaN(dob) || isNaN(dom)) { alert("Please enter valid dates."); return; }

        // 2. Age Logic (WHO Anthro Protocol)
        const ageDaysRaw = (dom - dob) / (1000 * 60 * 60 * 24);
        const ageDays = Math.round(ageDaysRaw); 
        if (ageDays < 0) { alert("Measurement date must be after birth date."); return; }

        const totalMonths = Math.floor(ageDays / 30.4375);
        const displayYears = Math.floor(totalMonths / 12);
        const displayMonths = totalMonths % 12;

        document.getElementById('ageDisplay').innerText = `Age: ${displayYears} yr ${displayMonths} mo (${totalMonths} mo)`;

        // 3. Length/Height correction (clenhei)
        let clenhei = height;
        if (ageDays < 731 && measure === 'H') {
            clenhei += 0.7; 
        } else if (ageDays >= 731 && measure === 'L') {
            clenhei -= 0.7; 
        }

        // 4. Define Indicators (WFH excluded as requested)
        const indicatorConfig = [
            { id: 'hfa', name: 'Height-for-age', val: !isNaN(clenhei) ? clenhei : NaN },
            { 
                id: 'wfa', 
                name: 'Weight-for-age', 
                val: (!isNaN(weight) && totalMonths <= 120 && oedema !== 'y') ? weight : NaN 
            },
            { 
                id: 'bmi', 
                name: 'BMI-for-age', 
                val: (!isNaN(weight) && !isNaN(clenhei) && oedema !== 'y') ? (weight / Math.pow(clenhei / 100, 2)) : NaN 
            }
        ];

        const resultsBody = document.getElementById('multi-results');
        resultsBody.innerHTML = "<tr><td colspan='3' style='padding: 10px;'>Calculating...</td></tr>"; 

        // 5. Create Calculation Promises
        const promises = indicatorConfig.map(ind => {
            // Absolute limit of 19 years (228 months)
            if (totalMonths > 228 || isNaN(ind.val)) {
                return Promise.resolve({ name: ind.name, id: ind.id, score: "NA", percentile: "NA" });
            }

            return new Promise((resolve) => {
                const ageSuffix = (totalMonths <= 60) ? "0_5" : "5_19";
                const fileName = `data/${ind.id}_${sex}_${ageSuffix}.csv`;

                Papa.parse(fileName, {
                    download: true,
                    header: true,
                    dynamicTyping: true,
complete: function(results) {
    const data = results.data.filter(row => row.L !== undefined);
    
    let lookupCol = (totalMonths <= 60) ? 'Day' : 'Month';
    let target = (totalMonths <= 60) ? ageDays : (ageDays / 30.4375); // Use precise decimal months

    // 1. Find the two surrounding rows for interpolation
    let row1 = data[0];
    let row2 = data[0];

    for (let i = 0; i < data.length - 1; i++) {
        if (target >= data[i][lookupCol] && target <= data[i+1][lookupCol]) {
            row1 = data[i];
            row2 = data[i+1];
            break;
        }
    }

    // 2. Calculate the interpolation factor (fractional distance between rows)
    const diff = row2[lookupCol] - row1[lookupCol];
    const factor = diff === 0 ? 0 : (target - row1[lookupCol]) / diff;

    // 3. Interpolate L, M, and S parameters
    const L = row1.L + (row2.L - row1.L) * factor;
    const M = row1.M + (row2.M - row1.M) * factor;
    const S = row1.S + (row2.S - row1.S) * factor;
    const y = ind.val;

    // 4. Standard LMS Z-score
    let zScore = (Math.pow((y / M), L) - 1) / (L * S);

    // 5. Apply WHO 2007 Tail Correction (5-19y, Weight/BMI only)
    if (totalMonths > 60 && ind.id !== 'hfa') {
        if (zScore > 3) {
            const sd3pos = M * Math.pow(1 + L * S * 3, 1 / L);
            const sd2pos = M * Math.pow(1 + L * S * 2, 1 / L);
            zScore = 3 + (y - sd3pos) / (sd3pos - sd2pos);
        } else if (zScore < -3) {
            const sd3neg = M * Math.pow(1 + L * S * (-3), 1 / L);
            const sd2neg = M * Math.pow(1 + L * S * (-2), 1 / L);
            zScore = -3 + (y - sd3neg) / (sd2neg - sd3neg);
        }
    }

    const percentile = zToPercentile(zScore);
    resolve({ name: ind.name, id: ind.id, score: zScore.toFixed(2), percentile: percentile });
},
                    error: () => resolve({ name: ind.name, id: ind.id, score: "Error", percentile: "NA" })
                });
            });
        });

        // 6. Final Rendering
        Promise.all(promises).then(orderedResults => {
            resultsBody.innerHTML = ""; 
            orderedResults.forEach(res => {
                appendResultRow(res.name, res.id, res.score, res.percentile);
            });
        });
    }

    // 7. Styling and Flagging (WHO Table Specs)
    function appendResultRow(name, id, score, percentile) {
        const resultsBody = document.getElementById('multi-results');
        const zNum = parseFloat(score);
        
        let cellBase = "padding: 8px 12px; font-weight: bold; border-radius: 4px; display: inline-block; min-width: 60px; text-align: center;";
        let zColor = "#0056b3", zBg = "transparent", pColor = "#666", pBg = "transparent", label = "";

        if (score !== 'NA' && !isNaN(zNum)) {
            const limits = { wfa: {l: -6, h: 5}, hfa: {l: -6, h: 6}, bmi: {l: -5, h: 5} };
            const limit = limits[id];

            if (zNum < limit.l || zNum > limit.h) {
                zBg = "#ffcccc"; zColor = "#d9534f"; label = " (Flagged)";
            } else if (zNum < -3 || zNum > 3) {
                zBg = "#333"; zColor = "#fff"; pBg = "#333"; pColor = "#fff"; label = " (Extreme)";
            } else if (Math.abs(zNum) > 2) {
                zBg = "#ff0000"; zColor = "#fff"; // Red
            } else if (Math.abs(zNum) > 1) {
                zBg = "#FFD700"; zColor = "#000"; // Gold
            } else {
                zBg = "#90EE90"; zColor = "#000"; // Green
            }
        }

        resultsBody.innerHTML += `
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 10px;">${name}</td>
                <td style="padding: 5px;"><div style="${cellBase} background-color: ${zBg}; color: ${zColor};">${score}${label}</div></td>
                <td style="padding: 5px;"><div style="${cellBase} background-color: ${pBg}; color: ${pColor};">${percentile}</div></td>
            </tr>`;
    }

    // 8. Live BMI Display
    function updateBMI() {
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const oedema = document.getElementById('oedema').value;
        const display = document.getElementById('bmiDisplay');
        
        if (!isNaN(weight) && !isNaN(height) && height > 0 && oedema !== 'y') {
            const bmi = weight / Math.pow(height / 100, 2);
            display.innerText = `Current BMI: ${bmi.toFixed(2)}`;
        } else {
            display.innerText = "";
        }
    }

    document.getElementById('weight').addEventListener('input', updateBMI);
    document.getElementById('height').addEventListener('input', updateBMI);
    document.getElementById('oedema').addEventListener('change', updateBMI);

    // 9. Percentile Calculation (NA beyond +/- 3 SD)
    function zToPercentile(z) {
        if (z === "NA" || isNaN(z)) return "NA";
        const zNum = parseFloat(z);
        if (zNum < -3 || zNum > 3) return "NA";

        const t = 1 / (1 + 0.2316419 * Math.abs(zNum));
        const d = 0.3989423 * Math.exp(-zNum * zNum / 2);
        let p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
        if (zNum > 0) p = 1 - p;
        return (p * 100).toFixed(1) + "th";
    }
</script>
</body>
</html>
